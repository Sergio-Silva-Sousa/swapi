name: swapo
description: Star Wars Databank with offline-first API caching.
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  cached_network_image: ^3.4.1
  cryptography: ^2.7.0
  dio: ^5.7.0
  drift: ^2.22.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  go_router: ^14.6.1
  path_provider: ^2.1.5
  riverpod_annotation: ^2.6.1
  sqlite3_flutter_libs: ^0.5.28

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
